name: Build desktop downloads
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac zip --arm64
            name: mac-arm64
          - os: macos-latest
            target: --mac zip --x64
            name: mac-x64
          - os: windows-latest
            target: --win portable --x64
            name: windows-x64
          - os: ubuntu-latest
            target: --linux AppImage --x64
            name: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run desktop:build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop-release/*.zip
            desktop-release/*.exe
            desktop-release/*.AppImage
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: downloads
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Offline GlassPDF desktop edition. All application assets are bundled; no hosting connection or account is needed to process documents. Exports are verified before download. Original files stay unchanged.

          Choose mac-arm64 for Apple Silicon, mac-x64 for Intel Macs, windows-x64 for Windows, or linux-x64 for Linux.

          These downloads are unsigned and not notarized. Only install them from this repository. Operating systems may require approval to open an unsigned application. Workspaces are not saved; download your results before closing. Browser/OS temporary memory is not guaranteed to be securely erased.
          EOF
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "GlassPDF $RELEASE_TAG — Offline desktop" --notes-file notes.md
          gh release upload "$RELEASE_TAG" downloads/* --clobber
